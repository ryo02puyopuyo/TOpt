<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dde8; stroke-width: 1.2; }
      .title { font-family: "Noto Sans CJK JP", "Yu Gothic", Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: "Noto Sans CJK JP", "Yu Gothic", Arial, sans-serif; font-size: 16px; fill: #5d6678; }
      .axis { stroke: #394150; stroke-width: 1.6; }
      .grid { stroke: #e6eaf2; stroke-width: 1; }
      .tick { font-family: Arial, sans-serif; font-size: 14px; fill: #5d6678; }
      .label { font-family: "Noto Sans CJK JP", "Yu Gothic", Arial, sans-serif; font-size: 17px; fill: #273247; }
      .small { font-family: "Noto Sans CJK JP", "Yu Gothic", Arial, sans-serif; font-size: 14px; fill: #5d6678; }
      .legend { font-family: "Noto Sans CJK JP", "Yu Gothic", Arial, sans-serif; font-size: 15px; fill: #273247; }
      .reuse { stroke: #1f78b4; fill: none; stroke-width: 4; }
      .noreuse { stroke: #d95f02; fill: none; stroke-width: 4; stroke-dasharray: 9 7; }
      .point-reuse { fill: #1f78b4; stroke: #ffffff; stroke-width: 2; }
      .point-noreuse { fill: #d95f02; stroke: #ffffff; stroke-width: 2; }
      .prune { fill: #66c2a5; }
      .basis { fill: #8da0cb; }
      .nullspace { fill: #fc8d62; }
      .fullcheck { fill: #e78ac3; }
      .other { fill: #a6d854; }
      .speed { fill: #4c78a8; }
      .note { fill: #fff8e5; stroke: #e0c46c; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="760"/>

  <text class="title" x="60" y="58">提案手法の実行時間評価の見せ方</text>
  <text class="subtitle" x="60" y="88">枝刈りパラメータ p と基底再利用の効果を、総時間・内訳・speedup の3段で示す模式図</text>

  <rect class="panel" x="45" y="120" width="440" height="520" rx="8"/>
  <rect class="panel" x="530" y="120" width="440" height="520" rx="8"/>
  <rect class="panel" x="1015" y="120" width="440" height="520" rx="8"/>

  <!-- Panel A: line chart -->
  <text class="label" x="70" y="156">A. p ごとの総実行時間</text>
  <text class="small" x="70" y="182">最適な枝刈り強度と再利用の効果をまず見せる</text>
  <line class="grid" x1="105" y1="250" x2="430" y2="250"/>
  <line class="grid" x1="105" y1="315" x2="430" y2="315"/>
  <line class="grid" x1="105" y1="380" x2="430" y2="380"/>
  <line class="grid" x1="105" y1="445" x2="430" y2="445"/>
  <line class="axis" x1="105" y1="510" x2="430" y2="510"/>
  <line class="axis" x1="105" y1="225" x2="105" y2="510"/>
  <text class="tick" x="77" y="515">0</text>
  <text class="tick" x="70" y="450">50</text>
  <text class="tick" x="62" y="385">100</text>
  <text class="tick" x="62" y="320">150</text>
  <text class="tick" x="62" y="255">200</text>
  <text class="tick" x="104" y="535">3</text>
  <text class="tick" x="181" y="535">5</text>
  <text class="tick" x="258" y="535">10</text>
  <text class="tick" x="338" y="535">15</text>
  <text class="tick" x="413" y="535">20</text>
  <text class="small" x="245" y="570">枝刈りパラメータ p</text>
  <text class="small" x="35" y="370" transform="rotate(-90 35 370)">実行時間 [s]</text>
  <polyline class="noreuse" points="105,275 185,335 265,290 345,245 425,255"/>
  <polyline class="reuse" points="105,355 185,405 265,372 345,333 425,345"/>
  <circle class="point-noreuse" cx="105" cy="275" r="5"/>
  <circle class="point-noreuse" cx="185" cy="335" r="5"/>
  <circle class="point-noreuse" cx="265" cy="290" r="5"/>
  <circle class="point-noreuse" cx="345" cy="245" r="5"/>
  <circle class="point-noreuse" cx="425" cy="255" r="5"/>
  <circle class="point-reuse" cx="105" cy="355" r="5"/>
  <circle class="point-reuse" cx="185" cy="405" r="5"/>
  <circle class="point-reuse" cx="265" cy="372" r="5"/>
  <circle class="point-reuse" cx="345" cy="333" r="5"/>
  <circle class="point-reuse" cx="425" cy="345" r="5"/>
  <line class="reuse" x1="180" y1="610" x2="220" y2="610"/>
  <text class="legend" x="230" y="615">基底再利用あり</text>
  <line class="noreuse" x1="180" y1="632" x2="220" y2="632"/>
  <text class="legend" x="230" y="637">基底再利用なし</text>

  <!-- Panel B: stacked bars -->
  <text class="label" x="555" y="156">B. 時間内訳の積み上げ棒</text>
  <text class="small" x="555" y="182">どの処理が支配的か、p によって何が増減するかを説明する</text>
  <line class="grid" x1="590" y1="250" x2="920" y2="250"/>
  <line class="grid" x1="590" y1="315" x2="920" y2="315"/>
  <line class="grid" x1="590" y1="380" x2="920" y2="380"/>
  <line class="grid" x1="590" y1="445" x2="920" y2="445"/>
  <line class="axis" x1="590" y1="510" x2="920" y2="510"/>
  <line class="axis" x1="590" y1="225" x2="590" y2="510"/>
  <text class="tick" x="562" y="515">0</text>
  <text class="tick" x="547" y="450">50</text>
  <text class="tick" x="540" y="385">100</text>
  <text class="tick" x="540" y="320">150</text>
  <text class="tick" x="540" y="255">200</text>
  <g transform="translate(630 0)">
    <rect class="other" x="0" y="280" width="36" height="45"/>
    <rect class="fullcheck" x="0" y="325" width="36" height="45"/>
    <rect class="nullspace" x="0" y="370" width="36" height="70"/>
    <rect class="basis" x="0" y="440" width="36" height="35"/>
    <rect class="prune" x="0" y="475" width="36" height="35"/>
    <rect class="other" x="48" y="365" width="36" height="22"/>
    <rect class="fullcheck" x="48" y="387" width="36" height="28"/>
    <rect class="nullspace" x="48" y="415" width="36" height="48"/>
    <rect class="basis" x="48" y="463" width="36" height="20"/>
    <rect class="prune" x="48" y="483" width="36" height="27"/>
    <text class="tick" x="-4" y="535">なし</text>
    <text class="tick" x="50" y="535">あり</text>
    <text class="tick" x="20" y="558">p=5</text>
  </g>
  <g transform="translate(755 0)">
    <rect class="other" x="0" y="245" width="36" height="38"/>
    <rect class="fullcheck" x="0" y="283" width="36" height="30"/>
    <rect class="nullspace" x="0" y="313" width="36" height="92"/>
    <rect class="basis" x="0" y="405" width="36" height="55"/>
    <rect class="prune" x="0" y="460" width="36" height="50"/>
    <rect class="other" x="48" y="333" width="36" height="20"/>
    <rect class="fullcheck" x="48" y="353" width="36" height="22"/>
    <rect class="nullspace" x="48" y="375" width="36" height="70"/>
    <rect class="basis" x="48" y="445" width="36" height="25"/>
    <rect class="prune" x="48" y="470" width="36" height="40"/>
    <text class="tick" x="-4" y="535">なし</text>
    <text class="tick" x="50" y="535">あり</text>
    <text class="tick" x="17" y="558">p=15</text>
  </g>
  <text class="small" x="720" y="590">各 p で「再利用なし」と「再利用あり」を並べる</text>

  <rect class="prune" x="570" y="610" width="14" height="14"/>
  <text class="legend" x="590" y="623">枝刈り判定</text>
  <rect class="basis" x="680" y="610" width="14" height="14"/>
  <text class="legend" x="700" y="623">基底構築・更新</text>
  <rect class="nullspace" x="825" y="610" width="14" height="14"/>
  <text class="legend" x="845" y="623">nullspace</text>
  <rect class="fullcheck" x="570" y="635" width="14" height="14"/>
  <text class="legend" x="590" y="648">詳細判定</text>
  <rect class="other" x="680" y="635" width="14" height="14"/>
  <text class="legend" x="700" y="648">その他</text>

  <!-- Panel C: speedup -->
  <text class="label" x="1040" y="156">C. 基底再利用による speedup</text>
  <text class="small" x="1040" y="182">time_without_reuse / time_with_reuse を直接示す</text>
  <line class="grid" x1="1075" y1="250" x2="1405" y2="250"/>
  <line class="grid" x1="1075" y1="315" x2="1405" y2="315"/>
  <line class="grid" x1="1075" y1="380" x2="1405" y2="380"/>
  <line class="grid" x1="1075" y1="445" x2="1405" y2="445"/>
  <line class="axis" x1="1075" y1="510" x2="1405" y2="510"/>
  <line class="axis" x1="1075" y1="225" x2="1075" y2="510"/>
  <text class="tick" x="1045" y="515">1.0</text>
  <text class="tick" x="1045" y="450">1.2</text>
  <text class="tick" x="1045" y="385">1.4</text>
  <text class="tick" x="1045" y="320">1.6</text>
  <text class="tick" x="1045" y="255">1.8</text>
  <rect class="speed" x="1100" y="405" width="38" height="105"/>
  <rect class="speed" x="1168" y="355" width="38" height="155"/>
  <rect class="speed" x="1236" y="325" width="38" height="185"/>
  <rect class="speed" x="1304" y="300" width="38" height="210"/>
  <rect class="speed" x="1372" y="315" width="38" height="195"/>
  <text class="tick" x="1110" y="535">3</text>
  <text class="tick" x="1178" y="535">5</text>
  <text class="tick" x="1243" y="535">10</text>
  <text class="tick" x="1311" y="535">15</text>
  <text class="tick" x="1379" y="535">20</text>
  <text class="small" x="1215" y="570">枝刈りパラメータ p</text>
  <text class="small" x="1003" y="385" transform="rotate(-90 1003 385)">speedup [x]</text>

  <rect class="note" x="1080" y="590" width="315" height="58" rx="6"/>
  <text class="small" x="1095" y="615">結論の書き方:</text>
  <text class="small" x="1095" y="638">「p=15付近で最小時間、再利用で約1.5倍高速化」</text>

  <text class="subtitle" x="60" y="710">実データでは、Aで結論、Bで理由、Cで再利用法の効果を定量的に示すと読みやすい。</text>
</svg>
